[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-htr"
version = "0.1.0"
description = "Reproducible tooling for the R.O.A.D. Barbados HTR challenge"
requires-python = ">=3.10,<3.14"
dependencies = [
  "Pillow>=10.3,<13",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

