  validation_frequency: 1
  optimizer: AdamW
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_steps: 200
  scheduler: cosine
  cosine_epochs: 40
  all_data_cosine_epochs: 20
  normalization: NFD
  augment: true
