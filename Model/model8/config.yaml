pretrained_model: checkpoints/model8/medium.safetensors
train_csv: data/processed/train_folds.csv
image_dir: data/raw/images
exclude_ids: config/known_bad_train_ids.txt
prepared_dir: data/processed/model8
output_dir: outputs/model8/fold{fold}
validation_fold: 0
seed: 20260903
image_variant: full
runtime:
  device: cuda:0
  precision: bf16-mixed
  workers: 4
  threads: 2
inference:
  accelerator: cpu
  device: auto
  precision: 32-true
  batch_size: 1
  threads: 8
  line_workers: 0
  padding: 16
  progress_every: 25
  constrain_charset: true
training:
  codec_resize: union
  height: 128
  max_width: 6144
